# ros2_control configuration of the RoboCraft cell (Gazebo: velocity command interface).
# GENERATED by generate_controllers.py - edit that file, not this one.
# One controller manager, one JointTrajectoryController per arm (serial mode:
# arms are commanded independently; parallel mode: the cell interface sends
# time-synchronised goals with a common start stamp to all gripping arms),
# one GripperActionController per rack-and-pinion gripper.
controller_manager:
  ros__parameters:
    update_rate: 250  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm1_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm1_gripper_controller:
      type: position_controllers/GripperActionController
    arm2_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm2_gripper_controller:
      type: position_controllers/GripperActionController
    arm3_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm3_gripper_controller:
      type: position_controllers/GripperActionController

arm1_controller:
  ros__parameters:
    joints: [arm1_joint1, arm1_joint2, arm1_joint3, arm1_joint4]
    command_interfaces: [velocity]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    gains:
      arm1_joint1: {p: 25.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      arm1_joint2: {p: 25.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      arm1_joint3: {p: 30.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      arm1_joint4: {p: 15.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      arm1_joint1: {trajectory: 0.08, goal: 0.01}
      arm1_joint2: {trajectory: 0.08, goal: 0.01}
      arm1_joint3: {trajectory: 0.02, goal: 0.003}
      arm1_joint4: {trajectory: 0.2, goal: 0.01}

arm1_gripper_controller:
  ros__parameters:
    joint: arm1_finger_left_joint
    goal_tolerance: 0.002
    max_effort: 20.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 0.5

